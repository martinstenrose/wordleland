{{/* One active choice among several, as a row of pills with its own
     container (padding, bottom rule). Data: {Label string; Items
     []{Label, Href string; On bool}} — chromeOpt's shape. */}}
{{define "pill-nav"}}
<nav class="pill-nav"{{with .Label}} aria-label="{{.}}"{{end}}>
  {{range .Items}}<a class="pill-nav-item{{if .On}} on{{end}}" href="{{.Href}}"{{if .On}} aria-current="page"{{end}}>{{.Label}}</a>{{end}}
</nav>
{{end}}
