name: release

# Tags publish a release. Pushes to main publish a rolling `testing` tag so
# there's always an image for the tip of the branch without cutting a
# release. The dispatch button publishes whatever branch is chosen, tagged
# by branch and commit rather than as a version — except main, which still
# gets `testing` so a manual rebuild of main doesn't leave a stray `main`
# tag alongside it.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

# main builds supersede each other: if five merges land within a minute,
# only the last one's build needs to finish, and cancelling the rest saves
# runner time and avoids an older build finishing after a newer one and
# leaving `testing` pointing at stale code. A release tag never cancels —
# ref_type is "tag", not "branch" — because a release build must run to
# completion once started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # No v on the image tags: {{version}} strips it, so the git tag
          # v1.2.3 publishes 1.2.3. The v is a git convention and registries
          # do not use it — image:1.2.3 is what a reader expects.
          #
          # latest follows released versions only. A push to main or a
          # dispatch build must never claim it, or deploying "latest" would
          # ship whatever was last merged or pushed by hand rather than a
          # release.
          #
          # main is special-cased to the fixed `testing` tag (Vaultwarden's
          # convention) rather than the branch-name rule, so it doesn't also
          # publish a `main` tag alongside it. Every other branch still gets
          # tagged by its own name via dispatch.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=testing,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Named explicitly: the default is the last stage in the
          # Dockerfile, which would publish the wrong image the moment a
          # stage is appended below it.
          # The Go build cross-compiles from the runner's own architecture,
          # so arm64 costs a compile rather than a QEMU-emulated build.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
