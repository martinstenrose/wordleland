name: release

# Tags publish a release; the dispatch button publishes whatever branch is
# chosen, tagged by branch and commit rather than as a version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # No v on the image tags: {{version}} strips it, so the git tag
          # v1.2.3 publishes 1.2.3. The v is a git convention and registries
          # do not use it — image:1.2.3 is what a reader expects.
          #
          # latest follows released versions only. A dispatch build from a
          # branch must never claim it, or deploying "latest" would ship
          # whatever was last pushed by hand.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Named explicitly: the default is the last stage in the
          # Dockerfile, which would publish the wrong image the moment a
          # stage is appended below it.
          # The Go build cross-compiles from the runner's own architecture,
          # so arm64 costs a compile rather than a QEMU-emulated build.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
