name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # A draft is reviewed once it is marked ready (ready_for_review above).
    if: github.event.pull_request.draft == false
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'dependabot'
          # The review is written out here rather than taken from the
          # code-review plugin, which stays silent on a PR it judges trivial,
          # on a draft, on every push after its first comment, and posts no
          # summary when it finds something. This one always leaves exactly
          # one summary comment and edits it on each push, and does not
          # repeat an inline comment a previous push already made.
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }}.
            Its head commit is ${{ github.event.pull_request.head.sha }}.

            Use the gh CLI for GitHub (`gh pr view`, `gh pr diff`); do not use web fetch.
            Read AGENTS.md and any CLAUDE.md in the repository root or in a
            directory the PR touches: they are the project's rules.

            1. Read the PR's title, description and diff.
            2. Look for issues, in parallel subagents where it helps:
               - rule violations: a change that breaks a rule in AGENTS.md or
                 CLAUDE.md, where you can quote the rule;
               - bugs: code that will not compile, or that gives wrong results
                 whatever the input, or a security problem in the changed lines.
               Only high-signal issues. Do not flag style, nitpicks, pre-existing
               issues, things a linter catches, or anything you are not sure of.
            3. Check each issue again against the code before keeping it.
            4. Read the inline comments already on the PR with
               `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`.
               For each issue kept that none of them already raises, post one inline comment with
               `mcp__github_inline_comment__create_inline_comment` (confirmed: true):
               what is wrong, why, and a committable suggestion only if it fixes
               the issue on its own.
            5. Always post the summary, whether or not issues were found, with
               `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "<body>"`,
               so a later push edits the same comment instead of adding one.
               The body:

               ## Code review

               Reviewed at <short head sha>.

               Then either "No issues found. Checked for bugs and AGENTS.md / CLAUDE.md compliance."
               or a numbered list of the issues, one line each, linking to the
               code as https://github.com/${{ github.repository }}/blob/<full head sha>/<path>#L<start>-L<end>.

            Post nothing else.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments),Read,Glob,Grep,Agent"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

