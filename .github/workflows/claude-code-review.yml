name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # A draft is reviewed once it is marked ready (ready_for_review above).
    if: github.event.pull_request.draft == false
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'dependabot'
          # The review is written out here rather than taken from the
          # code-review plugin, which stays silent on a PR it judges trivial,
          # on a draft, on every push after its first comment, and posts no
          # summary when it finds something. This one always leaves exactly
          # one summary comment and edits it on each push, and does not
          # repeat an inline comment a previous push already made. The
          # summary also says what the PR does, what it changes on a running
          # deployment, and what an operator has to do to apply it.
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }}.
            Its head commit is ${{ github.event.pull_request.head.sha }}.

            Use the gh CLI for GitHub (`gh pr view`, `gh pr diff`); do not use web fetch.
            The project's rules are in its agent instructions (AGENTS.md, and
            any CLAUDE.md in the repository root or in a directory the PR
            touches) and its documentation (README.md, CONTRIBUTING.md and
            docs/). Read them.

            1. Read the PR's title, description and diff.
            2. Look for issues, in parallel subagents where it helps:
               - rule violations: a change that breaks a rule in the agent
                 instructions or the documentation, where you can quote the rule;
               - stale documentation: README.md, CONTRIBUTING.md or docs/ saying something the
                 change makes untrue, where you can quote the sentence;
               - bugs: code that will not compile, or that gives wrong results
                 whatever the input, or a security problem in the changed lines.
               Only high-signal issues. Do not flag style, nitpicks, pre-existing
               issues, things a linter catches, or anything you are not sure of.
            3. Check each issue again against the code before keeping it.
            4. Work out what the change means once it is deployed:
               - what it reaches: the `app` image (cmd/, internal/, the
                 Dockerfile, go.mod), the compose.yml or .env.example an
                 operator copies, CI only, or documentation only;
               - what changes on a running deployment: a schema migration
                 run at startup (a new file in internal/store/migrations, and
                 whether it rewrites existing rows), a new or changed `.env`
                 variable and its default, a page or route players see
                 differently, something the Signal bridge or bot posts to the
                 group, a changed admin CLI verb, a new compose service or
                 volume;
               - for a version bump, any breaking change, deprecation or
                 upgrade step in the release notes in the PR description,
                 whether the bump crosses a major version, and whether the
                 code this repository uses is what changed;
               - what an operator has to do to apply it, beyond pulling the
                 next release: a variable to add to `.env`, a change to copy
                 into their own compose.yml, a manual step.
               This is context, not a list of defects: a risk you cannot tie to
               a concrete problem in the code goes here, not in the issues.
               If you could not check something (no release notes in the PR
               description, code the change depends on that you did not
               read), say so rather than guess.
            5. Read the inline comments already on the PR with
               `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`.
               For each issue kept that none of them already raises, post one inline comment with
               `mcp__github_inline_comment__create_inline_comment` (confirmed: true):
               what is wrong, why, and a committable suggestion only if it fixes
               the issue on its own.
            6. Always post the summary, whether or not issues were found, with
               `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "<body>"`,
               so a later push edits the same comment instead of adding one.
               The body, in plain words and short enough to read at a glance:

               ## Code review

               Reviewed at <short head sha>.

               **What it does:** one to three sentences on what the PR changes
               and why, and which parts of the app it touches. Describe the
               effect, not the diff line by line.

               **Impact:** a few bullets from step 4, only the ones that apply,
               ending with what an operator has to do to apply it. For a change
               with nothing to deploy, say so in one line.

               **Issues:** either "None found. Checked for bugs and compliance with documentation and agent instructions."
               or a numbered list of the issues, one line each, linking to the
               code as https://github.com/${{ github.repository }}/blob/<full head sha>/<path>#L<start>-L<end>.

               **Verdict:** one line: safe to merge, merge with care (and why),
               or fix the issues first.

            Post nothing else.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments),Read,Glob,Grep,Agent"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

