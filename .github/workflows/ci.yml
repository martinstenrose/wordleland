name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Nothing here writes anything back, so the token gets read access and no
# more. Without this it inherits whatever the repository's default is, which
# is a setting somebody can widen without touching this file.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go build ./...

      # The race detector, because the bridge shares its health state
      # with the HTTP handlers that report it. A data race there is exactly
      # the kind of thing that never reproduces on one machine.
      - run: go test -race ./...

      # staticcheck catches what go vet does not. Deliberate exceptions
      # carry a //lint:ignore naming the reason, so a hit here is a real
      # one.
      #
      # Pinned rather than @latest: a new release can add a check, and a
      # build that starts failing on a morning nobody pushed anything is a
      # bad way to find that out. Raise it deliberately.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          "$(go env GOPATH)/bin/staticcheck" ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Built but never pushed: publishing is what tags are for. This only
      # answers whether the Dockerfile still works, which is not something
      # go test can tell us.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

  # What a browser makes of the markup: whether following a link reloads the
  # document, where the page is scrolled to afterwards, whether two headings
  # are the same height. None of that is in the HTML, and every assertion
  # here was a bug that shipped past `go test ./...`. Behind a build tag so
  # the job above stays fast and needs nothing installed; this one drives
  # the Chrome the runner already has, over the DevTools protocol, with the
  # websocket client the bridge already depends on. Nothing is downloaded.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The tagged file is not compiled by the job above, so it is vetted
      # and checked here — a test that does not build is not a test.
      - run: go vet -tags browser ./internal/web/
      - name: staticcheck (browser tag)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          "$(go env GOPATH)/bin/staticcheck" -tags browser ./internal/web/

      # -count=1: a browser run is never a cache hit worth trusting.
      # -v: a skipped test is a missing browser, and that should be seen.
      - run: go test -tags browser -run TestBrowser -count=1 -v ./internal/web/
