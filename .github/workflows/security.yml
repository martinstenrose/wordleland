name: security

# Runs on pull requests and on a schedule. The schedule is the point: an
# advisory published next week is not a code change, so a scan that only
# fires on pull requests would never mention it and the repository would go
# quietly stale.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Reports only advisories the code actually reaches, so a hit here is
      # work to do rather than noise to triage. It also catches the go
      # directive in go.mod going stale: that is a floor, and Dependabot
      # does not raise it.
      #
      # The version pinned here is the tool's, not the advisory database's:
      # that is fetched at run time, so the weekly scan still sees what was
      # published this week. Pinning only stops a tool release changing the
      # result on a morning nobody pushed anything.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Single platform and loaded into the local daemon: the scanner needs
      # an image it can read, and a multi-platform build cannot be loaded.
      # What this catches is the base image, which govulncheck cannot see —
      # it knows Go modules, not Debian packages.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: wordleland:scan
          cache-from: type=gha,scope=ci

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wordleland:scan
          format: sarif
          output: trivy.sarif
          # Anything without a fix available is noise on a pull request:
          # there is nothing to do about it until upstream ships one.
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy
