<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34" width="34" height="34" role="img" aria-labelledby="t">
  <title id="t">Wordleland</title>
  <!-- The app mark, for a light background: a 3x3 grid solving on the
       diagonal — three guesses in at the top left, two in the middle, one at
       the bottom right. The fills are the flat sRGB equivalents of the
       board's own score ramp in light mode (internal/web/static/app.css),
       with the two deepest steps gamut-mapped by chroma reduction, which is
       what a browser does with them too. Nothing here is translucent: a logo
       is drawn against a background it does not know. -->
  <rect x=".5" y=".5" width="33" height="33" rx="7.5" fill="#efeae6" stroke="#e7e3df"/>
  <g>
    <rect x="4"  y="4"  width="8" height="8" rx="2" fill="#6fb789"/>
    <rect x="13" y="4"  width="8" height="8" rx="2" fill="#ded9d5"/>
    <rect x="22" y="4"  width="8" height="8" rx="2" fill="#ded9d5"/>

    <rect x="4"  y="13" width="8" height="8" rx="2" fill="#ded9d5"/>
    <rect x="13" y="13" width="8" height="8" rx="2" fill="#007742"/>
    <rect x="22" y="13" width="8" height="8" rx="2" fill="#ded9d5"/>

    <rect x="4"  y="22" width="8" height="8" rx="2" fill="#ded9d5"/>
    <rect x="13" y="22" width="8" height="8" rx="2" fill="#ded9d5"/>
    <rect x="22" y="22" width="8" height="8" rx="2" fill="#00572f"/>
  </g>
</svg>
